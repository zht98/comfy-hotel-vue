name: Manual Static Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build static site
        run: bun run build

      # ==========================================
      # 核心修复：强行提取并自动将全站源码洗成纯相对路径
      # ==========================================
      - name: Extract and Make Paths Truly Relative
        run: |
          rm -rf output
          mkdir -p output
          
          # 1. 提取资产
          if [ -d ".output/public" ]; then
            cp -r .output/public/* output/
          elif [ -d "dist/client" ]; then
            cp -r dist/client/* output/
          elif [ -d "dist" ]; then
            cp -r dist/* output/
          fi

          if [ -d "output/client" ]; then
            cp -r output/client/* output/
            rm -rf output/client
          fi

          # 2. 组装相对路径的 index.html 入口
          if [ ! -f "output/index.html" ]; then
            echo "Generating adaptive SPA fallback..."
            MAIN_JS=$(basename $(ls output/assets/index-*.js 2>/dev/null | head -n 1))
            MAIN_CSS=$(basename $(ls output/assets/styles-*.css 2>/dev/null | head -n 1))
            
            cat <<EOT > output/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Comfy Hotel</title>
              <link rel="stylesheet" href="./assets/${MAIN_CSS}">
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="./assets/${MAIN_JS}"></script>
            </body>
          </html>
          EOT
          fi

          # 3. 【降维打击补丁】使用 Linux 的 sed 命令，强行遍历所有的前端 js 代码，
          # 将内部硬编码试图冲向根目录的 "/assets/" 路径，全部修正为纯相对路径 "assets/"
          echo "Rewriting absolute asset requests in compilation files..."
          find output/assets/ -type f -name "*.js" -exec sed -i 's|"/assets/"|"assets/"|g' {} +
          find output/assets/ -type f -name "*.js" -exec sed -i "s|'/assets/'|'assets/'|g" {} +
          
          echo "Paths are now completely environmental-agnostic."

      # ==========================================
      # 强制将具有完美自适应能力的目录推回仓库
      # ==========================================
      - name: Commit and Push to output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f output/
          git commit -m "chore: make entire site fully adaptive with true relative paths $(date +'%Y-%m-%d %H:%M:%S') [skip ci]" || echo "No files to commit"
          git push origin main

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-dist
          path: ./output
