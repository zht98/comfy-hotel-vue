name: Manual Static Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build static site
        run: bun run build

      # ==========================================
      # 核心修复：强行提取资源，并采用相对路径（./）组装入口
      # ==========================================
      - name: Extract Static Files to Output
        run: |
          rm -rf output
          mkdir -p output
          
          # 1. 优先提取编译出的静态资产
          if [ -d ".output/public" ]; then
            cp -r .output/public/* output/
          elif [ -d "dist/client" ]; then
            cp -r dist/client/* output/
          elif [ -d "dist" ]; then
            cp -r dist/* output/
          fi

          # 2. 兼容处理 client 目录可能多嵌套一层的情况
          if [ -d "output/client" ]; then
            cp -r output/client/* output/
            rm -rf output/client
          fi

          # 3. 【绝对路径改相对路径】利用相对路径组装标准的单页应用入口
          if [ ! -f "output/index.html" ]; then
            echo "index.html not found. Generating SPA fallback..."
            
            # 找到体积最大或者第一个主 JS 文件
            MAIN_JS=$(basename $(ls output/assets/index-*.js 2>/dev/null | head -n 1))
            MAIN_CSS=$(basename $(ls output/assets/styles-*.css 2>/dev/null | head -n 1))
            
            echo "Detected main JS: $MAIN_JS"
            echo "Detected main CSS: $MAIN_CSS"

            # 【关键修改】这里的 href 和 src 改用了 "./assets/" 相对路径
            cat <<EOT > output/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Comfy Hotel</title>
              <link rel="stylesheet" href="./assets/${MAIN_CSS}">
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="./assets/${MAIN_JS}"></script>
            </body>
          </html>
          EOT
            echo "Successfully generated adaptive fallback index.html"
          fi

      # ==========================================
      # 强制将带自适应 index.html 的完整静态目录推回仓库
      # ==========================================
      - name: Commit and Push to output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f output/
          git commit -m "chore: use relative assets path in index.html $(date +'%Y-%m-%d %H:%M:%S') [skip ci]" || echo "No files to commit"
          git push origin main

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-dist
          path: ./output
